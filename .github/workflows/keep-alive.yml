# Pings the Supabase project twice a week so the free plan never pauses it for inactivity.
# GitHub switches off scheduled jobs in repos with no commits for 60 days, so when the repo
# has been quiet for 45 days this job also commits a tiny heartbeat file to keep itself on.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pdusjphcxyugzzfdhcbb.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_hle4nye7fyaX5DFv7NYIGw_hiwy8xDp")
          echo "Supabase answered $code"
          test "$code" = "200"
      - uses: actions/checkout@v4
      - name: Heartbeat commit if the repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .github/heartbeat
            git config user.name "keep-alive bot"
            git config user.email "actions@users.noreply.github.com"
            git add .github/heartbeat && git commit -m "Heartbeat: keep scheduled jobs on" && git push
          else
            echo "Repo active recently, no heartbeat needed"
          fi
